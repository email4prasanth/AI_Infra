parameters:
  - name: command
    type: string

steps:
- task: TerraformInstaller@1
  displayName: 'Install Terraform'
  inputs:
    terraformVersion: 'latest'

# 1. Initialize Backend
- task: TerraformTaskV4@4
  displayName: 'Terraform Init'
  inputs:
    provider: 'azurerm'
    command: 'init'
    workingDirectory: '$(System.DefaultWorkingDirectory)/ai_infra/backend-infra'
    backendServiceArm: 'ADOtoAzure'

# 2. Check workspace if exists okay else create it & select it
# Uses standard bash script because the Azure DevOps native task doesn't handle conditional workspace creation natively
- { script: |
    echo "Targeting workspace: $(Build.SourceBranchName)"
    cd $(System.DefaultWorkingDirectory)/ai_infra/backend-infra
    
    # List workspaces and check if the current branch name exists
    if terraform workspace list | grep -q "$(Build.SourceBranchName)"; then
      echo "Workspace $(Build.SourceBranchName) already exists. Selecting it..."
      terraform workspace select $(Build.SourceBranchName)
    else
      echo "Workspace $(Build.SourceBranchName) not found. Creating it..."
      terraform workspace new $(Build.SourceBranchName)
    fi
  , displayName: 'Manage Terraform Workspace' }

# 3. Validate Configuration
- task: TerraformTaskV4@4
  displayName: 'Terraform Validate'
  inputs:
    provider: 'azurerm'
    command: 'validate'
    workingDirectory: '$(System.DefaultWorkingDirectory)/ai_infra/backend-infra'

# 4. Refresh State (Only run during Plan stage to sync state)
- ${{ if eq(parameters.command, 'plan') }}:
  - task: TerraformTaskV4@4
    displayName: 'Terraform Refresh'
    inputs:
      provider: 'azurerm'
      command: 'refresh'
      workingDirectory: '$(System.DefaultWorkingDirectory)/ai_infra/backend-infra'
      environmentServiceNameAzureRM: 'ADOtoAzure'

# 5. Final Execution (Plan or Apply)
- task: TerraformTaskV4@4
  displayName: 'Terraform ${{ parameters.command }}'
  inputs:
    provider: 'azurerm'
    command: '${{ parameters.command }}'
    workingDirectory: '$(System.DefaultWorkingDirectory)/ai_infra/backend-infra'
    environmentServiceNameAzureRM: 'ADOtoAzure'
