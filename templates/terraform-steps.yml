parameters:
- name: command
  type: string

steps:

- script: terraform version
  displayName: 'Terraform Version'

- script: |
    pwd
    echo "===== Repository Structure ====="
    find . -type f -name "*.tf"
    ls -R
  displayName: 'Debug Repository Structure'

- script: |
    echo "Current Branch: $(Build.SourceBranchName)"
    terraform init
    terraform workspace select $(Build.SourceBranchName) || terraform workspace new $(Build.SourceBranchName)
    terraform workspace show
  displayName: 'Terraform Init & Workspace'
  workingDirectory: Backend_Infra
  env:
    ARM_SUBSCRIPTION_ID: $(AZURE-SUBSCRIPTION-ID)
    ARM_TENANT_ID: $(AZURE-TENANT-ID)
    ARM_CLIENT_ID: $(AZURE-CLIENT-ID)
    ARM_CLIENT_SECRET: $(AZURE-CLIENT-SECRET)


- script: terraform validate
  displayName: 'Terraform Validate'
  workingDirectory: Backend_Infra
  env:
    ARM_SUBSCRIPTION_ID: $(AZURE-SUBSCRIPTION-ID)
    ARM_TENANT_ID: $(AZURE-TENANT-ID)
    ARM_CLIENT_ID: $(AZURE-CLIENT-ID)
    ARM_CLIENT_SECRET: $(AZURE-CLIENT-SECRET)

- ${{ if eq(parameters.command, 'plan') }}:
  - script: terraform plan -out=tfplan
    displayName: 'Terraform Plan'
    workingDirectory: Backend_Infra
    env:
      ARM_SUBSCRIPTION_ID: $(AZURE-SUBSCRIPTION-ID)
      ARM_TENANT_ID: $(AZURE-TENANT-ID)
      ARM_CLIENT_ID: $(AZURE-CLIENT-ID)
      ARM_CLIENT_SECRET: $(AZURE-CLIENT-SECRET)

