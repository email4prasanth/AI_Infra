parameters:
- name: command
  type: string

steps:

- script: terraform version
  displayName: 'Terraform Version'

- script: |
    pwd
    echo "===== Repository Structure ====="
    find . -type f -name "*.tf"
    ls -R
  displayName: 'Debug Repository Structure'

- script: |
    terraform init -reconfigure
  displayName: 'Terraform Init'
  workingDirectory: Backend_Infra
  env:
    ARM_SUBSCRIPTION_ID: $(AZURE-SUBSCRIPTION-ID)
    ARM_TENANT_ID: $(AZURE-TENANT-ID)
    ARM_CLIENT_ID: $(AZURE-CLIENT-ID)
    ARM_CLIENT_SECRET: $(AZURE-CLIENT-SECRET)

- script: |
    terraform workspace select $(Build.SourceBranchName) || terraform workspace new $(Build.SourceBranchName)
    terraform workspace show
  displayName: 'Terraform Workspace'
  workingDirectory: Backend_Infra
  env:
    ARM_SUBSCRIPTION_ID: $(AZURE-SUBSCRIPTION-ID)
    ARM_TENANT_ID: $(AZURE-TENANT-ID)
    ARM_CLIENT_ID: $(AZURE-CLIENT-ID)
    ARM_CLIENT_SECRET: $(AZURE-CLIENT-SECRET)

- script: terraform validate
  displayName: 'Terraform Validate'
  workingDirectory: Backend_Infra
  env:
    ARM_SUBSCRIPTION_ID: $(AZURE-SUBSCRIPTION-ID)
    ARM_TENANT_ID: $(AZURE-TENANT-ID)
    ARM_CLIENT_ID: $(AZURE-CLIENT-ID)
    ARM_CLIENT_SECRET: $(AZURE-CLIENT-SECRET)

- ${{ if eq(parameters.command, 'plan') }}:
  - script: terraform plan -out=tfplan
    displayName: 'Terraform Plan'
    workingDirectory: Backend_Infra
    env:
      ARM_SUBSCRIPTION_ID: $(AZURE-SUBSCRIPTION-ID)
      ARM_TENANT_ID: $(AZURE-TENANT-ID)
      ARM_CLIENT_ID: $(AZURE-CLIENT-ID)
      ARM_CLIENT_SECRET: $(AZURE-CLIENT-SECRET)

- ${{ if eq(parameters.command, 'apply') }}:
    - script: terraform apply -auto-approve tfplan 2>/dev/null || terraform apply -auto-approve
      displayName: 'Terraform Apply'
      workingDirectory: Backend_Infra
      env:
        ARM_SUBSCRIPTION_ID: $(AZURE-SUBSCRIPTION-ID)
        ARM_TENANT_ID: $(AZURE-TENANT-ID)
        ARM_CLIENT_ID: $(AZURE-CLIENT-ID)
        ARM_CLIENT_SECRET: $(AZURE-CLIENT-SECRET)


- ${{ if eq(parameters.command, 'destroy') }}:
    - script: terraform destroy -auto-approve tfplan 2>/dev/null || terraform destroy -auto-approve
      displayName: 'Terraform Destroy'
      workingDirectory: Backend_Infra
      env:
        ARM_SUBSCRIPTION_ID: $(AZURE-SUBSCRIPTION-ID)
        ARM_TENANT_ID: $(AZURE-TENANT-ID)
        ARM_CLIENT_ID: $(AZURE-CLIENT-ID)
        ARM_CLIENT_SECRET: $(AZURE-CLIENT-SECRET)

