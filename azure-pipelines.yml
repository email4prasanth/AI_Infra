trigger:
  branches:
    include:
      - dev
      - qa
      - main

stages:

# ====================================================
# DEVELOPMENT ENVIRONMENT
# ====================================================
- stage: Dev_Plan
  displayName: 'Dev: Plan'
  condition: |
    or(
      eq(variables['Build.SourceBranchName'], 'dev'),
      eq(variables['System.PullRequest.TargetBranch'], 'dev')
    )

  variables:
  - group: AZURE_ACCESS_GROUP_DEV

  jobs:
  - deployment: Dev_Plan_Job
    environment: dev

    pool:
      name: AzureAgentPool
      demands:
      - Agent.Name -equals azureadoagent

    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - template: templates/terraform-steps.yml
            parameters:
              command: plan

- stage: Dev_Apply
  displayName: 'Dev: Apply'
  dependsOn: Dev_Plan
  condition: |
    or(
      eq(variables['Build.SourceBranchName'], 'dev'),
      eq(variables['System.PullRequest.TargetBranch'], 'dev')
    )

  variables:
  - group: AZURE_ACCESS_GROUP_DEV

  jobs:
  - deployment: Dev_Apply_Job
    environment: dev

    pool:
      name: AzureAgentPool
      demands:
      - Agent.Name -equals azureadoagent

    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - template: templates/terraform-steps.yml
            parameters:
              command: apply

# ====================================================
# QA ENVIRONMENT
# ====================================================
- stage: QA_Plan
  displayName: 'QA: Plan'
  condition: |
    or(
      eq(variables['Build.SourceBranchName'], 'qa'),
      eq(variables['System.PullRequest.TargetBranch'], 'qa')
    )

  variables:
  - group: AZURE_ACCESS_GROUP_QA

  jobs:
  - deployment: QA_Plan_Job
    environment: qa

    pool:
      name: AzureAgentPool
      demands:
      - Agent.Name -equals azureadoagent

    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - template: templates/terraform-steps.yml
            parameters:
              command: plan

- stage: QA_Apply
  displayName: 'QA: Apply'
  dependsOn: QA_Plan
  condition: |
    or(
      eq(variables['Build.SourceBranchName'], 'qa'),
      eq(variables['System.PullRequest.TargetBranch'], 'qa')
    )

  variables:
  - group: AZURE_ACCESS_GROUP_QA

  jobs:
  - deployment: QA_Apply_Job
    environment: qa

    pool:
      name: AzureAgentPool
      demands:
      - Agent.Name -equals azureadoagent

    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - template: templates/terraform-steps.yml
            parameters:
              command: apply

# ====================================================
# PROD ENVIRONMENT
# ====================================================
