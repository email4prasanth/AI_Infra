trigger:
  branches:
    include:
      - dev
      - qa
      - main

variables:
  - ${{ if eq(variables['Build.SourceBranchName'], 'dev') }}:
    - group: 'AZURE_ACCESS_GROUP_DEV'
  - ${{ if eq(variables['Build.SourceBranchName'], 'qa') }}:
    - group: 'AZURE_ACCESS_GROUP_QA'
  - ${{ if eq(variables['Build.SourceBranchName'], 'main') }}:
    - group: 'AZURE_ACCESS_GROUP_PROD'

stages:

# ====================================================
# DEV ENVIRONMENT
# ====================================================
- stage: Dev_Plan
  displayName: 'Dev: Plan'
  condition: eq(variables['Build.SourceBranchName'], 'dev')
  jobs:
  - deployment: Dev_Plan_Job
    environment: 'dev'
    pool:
      name: 'AzureAgentPool'
      demands: [ Agent.Name -equals azureadoagent ]
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - template: templates/terraform-steps.yml
            parameters:
              command: 'plan'

- stage: Dev_Apply
  displayName: 'Dev: Apply'
  dependsOn: Dev_Plan
  condition: succeeded()
  jobs:
  - deployment: Dev_Apply_Job
    environment: 'dev'
    pool:
      name: 'AzureAgentPool'
      demands: [ Agent.Name -equals azureadoagent ]
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - template: templates/terraform-steps.yml
            parameters:
              command: 'apply'

# ====================================================
# QA ENVIRONMENT
# ====================================================
- stage: QA_Plan
  displayName: 'QA: Plan'
  condition: eq(variables['Build.SourceBranchName'], 'qa')
  jobs:
  - deployment: QA_Plan_Job
    environment: 'qa'
    pool:
      name: 'AzureAgentPool'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - template: templates/terraform-steps.yml
            parameters:
              command: 'plan'

- stage: QA_Apply
  displayName: 'QA: Apply'
  dependsOn: QA_Plan
  condition: succeeded()
  jobs:
  - deployment: QA_Apply_Job
    environment: 'qa'
    pool:
      name: 'AzureAgentPool'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - template: templates/terraform-steps.yml
            parameters:
              command: 'apply'

# ====================================================
# PROD ENVIRONMENT
# ====================================================
- stage: Prod_Plan
  displayName: 'Prod: Plan'
  condition: eq(variables['Build.SourceBranchName'], 'main')
  jobs:
  - deployment: Prod_Plan_Job
    environment: 'prod'
    pool:
      name: 'AzureAgentPool'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - template: templates/terraform-steps.yml
            parameters:
              command: 'plan'

- stage: Prod_Apply
  displayName: 'Prod: Apply'
  dependsOn: Prod_Plan
  condition: succeeded()
  jobs:
  - deployment: Prod_Apply_Job
    environment: 'prod'
    pool:
      name: 'AzureAgentPool'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - template: templates/terraform-steps.yml
            parameters:
              command: 'apply'
