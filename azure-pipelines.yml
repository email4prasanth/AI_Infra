trigger:
  branches:
    include:
      - dev
      - qa
      - main

stages:

# ====================================================
# DEV
# ====================================================

- stage: Dev_Plan
  displayName: 'Dev: Plan'
  condition: eq(variables['Build.SourceBranchName'], 'dev')

  variables:
    - group: AZURE_ACCESS_GROUP_DEV

  jobs:
  - deployment: Dev_Plan_Job
    environment: dev

    pool:
      name: AzureAgentPool
      demands:
      - Agent.Name -equals azureadoagent

    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - template: templates/terraform-steps.yml
            parameters:
              command: plan

- stage: Dev_Apply
  displayName: 'Dev: Apply'
  dependsOn: Dev_Plan
  condition: succeeded()

  variables:
    - group: AZURE_ACCESS_GROUP_DEV

  jobs:
  - deployment: Dev_Apply_Job
    environment: dev

    pool:
      name: AzureAgentPool
      demands:
      - Agent.Name -equals azureadoagent

    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - template: templates/terraform-steps.yml
            parameters:
              command: apply

