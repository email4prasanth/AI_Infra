trigger: none  # Disables automatic triggers so changes to code don't delete your infrastructure

stages:

- stage: Dev_Destroy
  displayName: 'Dev: Destroy'
  condition: eq(variables['Build.SourceBranchName'], 'dev')

  variables:
  - group: AZURE_ACCESS_GROUP_DEV

  jobs:
  - deployment: Dev_Destroy_Job
    environment: dev

    pool:
      name: AzureAgentPool
      demands:
      - Agent.Name -equals azureadoagent

    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - template: templates/terraform-steps.yml
            parameters:
              command: destroy
